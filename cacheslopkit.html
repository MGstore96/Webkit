<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7.00 - 13.52 Webkit by MGstore</title>
<link rel="stylesheet" href="modifikasi.css">
</head>
<body>

<div class="container">
    <hr style="width: 100%;">
    <h2>Webkit by MGstore</h2>
    <div class="fw-status-card">
        <span class="status-dot" id="statusDot"></span>
        <span>Firmware: <b id="fwText">Detecting...</b></span>
        <span class="fw-badge" id="fwBadge">PS4</span>
    </div>

    <hr style="width: 100%;">
    <div class="logo-container">
        <img src="logo.png" alt="Logo MGstore" class="custom-logo" id="mainLogo" onerror="this.style.display='none'">
    </div>
    <h2 id="msgs">Memulai Instalasi Cache...</h2>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="credits">
        <strong>Special Thanks to:</strong><br>
        <a href="#">GamerHack93</a> <a href="#">sleirsgoevy</a> <a href="#">TheFlow</a> <a href="#">Flatz</a> 
        <a href="#">Egycnq</a> <a href="#">Jordy</a> <a href="#">Sonic-Iso</a> <a href="#">Abc</a> 
        <a href="#">Prb29327239</a> <a href="#">Feyzee61</a> <a href="#">AlAzif</a> <a href="#">ChendoChap</a> 
        <a href="#">Kameleonre_</a> <a href="#">SiSTR0</a>
    </div>
    <hr style="width: 100%;">
</div>

<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var Percent = Math.round((e.loaded / e.total) * 100);
    if (isNaN(Percent)) Percent = 0;
    document.getElementById("msgs").innerHTML = "Menginstal Cache Offline...";
    document.getElementById("progressBar").style.width = Percent + "%";
    document.getElementById("progressText").innerHTML = Percent + "%";
}

function DisplayCacheProgress() {
    document.getElementById("msgs").innerHTML = "Cache Berhasil Diinstal";
    document.getElementById("progressBar").style.width = "100%";
    document.getElementById("progressBar").style.background = "linear-gradient(90deg, #149187, #01ff61)";
    document.getElementById("progressText").innerHTML = "100%";
    window.location.reload();
}

if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onerror = function(e) { 
        document.getElementById("msgs").innerHTML = "Kesalahan Saat Menginstal Cache! - Bersihkan dan Buka Kembali Browser Anda ..."; 
        document.getElementById("progressBar").style.background = "linear-gradient(90deg, #cb2d3e, #ef473a)"; 
        document.getElementById("progressText").innerHTML = "ERROR";
    };
}
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

document.addEventListener("DOMContentLoaded", function() {
    var fwText = document.getElementById("fwText");
    var statusDot = document.getElementById("statusDot");
    var fwBadge = document.getElementById("fwBadge");

    if (isPS4) {
        fwText.innerHTML = fwVersion;
        var isSupported = (fwNum == 5.05 || fwNum == 5.07 || (fwNum >= 7.00 && fwNum <= 13.52));
        if (isSupported) {
            statusDot.className = "status-dot status-online";
            fwBadge.style.backgroundColor = "#10e610";
            fwBadge.innerText = "SUPPORTED";
        } else {
            statusDot.className = "status-dot status-offline";
            fwBadge.style.backgroundColor = "#e51d08";
            fwBadge.style.color = "#fff";
            fwBadge.innerText = "UNSUPPORTED";
        }
    } else {
        fwText.innerHTML = "Bukan PS4";
        statusDot.className = "status-dot status-offline";
        fwBadge.style.backgroundColor = "#cc1010";
        fwBadge.style.color = "#fff";
        fwBadge.innerText = "PC / MOBILE";
    }
});
</script>

</body>
</html>
