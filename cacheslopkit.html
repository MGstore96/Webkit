<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7.00 - 13.52 Webkit by MGstore</title>
<link rel="stylesheet" href="modifikasi.css">
</head>
<body>

<div class="container">
    <hr style="width: 100%;">
    <h2>7.00 - 13.52 Webkit by MGstore</h2>
    
    <!-- Status Indikator Firmware -->
    <div class="fw-status-card">
        <span class="status-dot" id="statusDot"></span>
        <span>Firmware: <b id="fwText">Detecting...</b></span>
        <span class="fw-badge" id="fwBadge">PS4</span>
    </div>

    <hr style="width: 100%;">

    <!-- LOGO CUSTOM -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="custom-logo" id="mainLogo" onerror="this.style.display='none'">
    </div>

    <!-- Pesan Status & Output Instalasi Cache -->
    <h2 id="msgs">Memulai Instalasi Cache...</h2>

    <!-- UI Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <!-- Credits -->
    <div class="credits">
        <strong>Special Thanks to:</strong><br>
        <a href="#">GamerHack93</a> <a href="#">sleirsgoevy</a> <a href="#">TheFlow</a> <a href="#">Flatz</a> 
        <a href="#">Egycnq</a> <a href="#">Jordy</a> <a href="#">Sonic-Iso</a> <a href="#">Abc</a> 
        <a href="#">Prb29327239</a> <a href="#">Feyzee61</a> <a href="#">AlAzif</a> <a href="#">ChendoChap</a> 
        <a href="#">Kameleonre_</a> <a href="#">SiSTR0</a>
    </div>
    <hr style="width: 100%;">
</div>

<script>
history.replaceState(null,null,'index.html');
var histlength=history.length;
history.go(-histlength);

function setMsg(htmlContent, type) {
    var msgsElem = document.getElementById("msgs");
    if(!msgsElem) return;
    
    msgsElem.className = ""; 
    if (type === "success") {
        msgsElem.classList.add("success");
    } else if (type === "error") {
        msgsElem.classList.add("error");
    }
    msgsElem.innerHTML = htmlContent;
}

function DLProgress(e){
    Percent = Math.round(e.loaded / e.total * 100);
    setMsg("Menginstal Cache Offline: " + Percent + "%", "running");
    
    var bar = document.getElementById("pbar");
    if (bar) {
        bar.style.width = Percent + "%";
        
        // Logika perubahan warna berdasarkan persentase
        if (Percent < 30) {
            bar.style.background = 'linear-gradient(90deg, #ff6b6b, #d90404)'; // Merah
        } else if (Percent < 70) {
            bar.style.background = 'linear-gradient(90deg, #fceb00, #c4b000)'; // Kuning
        } else {
            bar.style.background = 'linear-gradient(90deg, #e8fb01, #08e238)'; // Hijau (Warna asli)
        }
    }
}

function DisplayCacheProgress(){
    setMsg("Cache Berhasil Diinstal", "success");
    var bar = document.getElementById("pbar");
    if (bar) {
        bar.style.width = "100%";
        bar.style.background = 'linear-gradient(90deg, #e8fb01, #08e238)'; // Pastikan berwarna hijau saat 100%
    }
    setTimeout(function(){
        window.location.href = "index.html";
    }, 1500);
}

window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
window.applicationCache.onerror = function(e){
    setMsg("Kesalahan Saat Menginstal Cache! - Bersihkan dan Buka Kembali Browser Anda ...", "error");
};
// Deteksi Firmware PS4 untuk Indikator Status
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

document.addEventListener("DOMContentLoaded", function() {
    var fwText = document.getElementById("fwText");
    var statusDot = document.getElementById("statusDot");
    var fwBadge = document.getElementById("fwBadge");

    if (isPS4) {
        fwText.innerHTML = fwVersion;
        var isSupported = (fwNum == 5.05 || fwNum == 5.07 || 
                           (fwNum >= 7.00 && fwNum <= 8.52) || 
                           (fwNum >= 9.00 && fwNum <= 9.60) || 
                           (fwNum >= 10.00 && fwNum <= 11.02) || 
                           (fwNum >= 11.50 && fwNum <= 13.52));
        if (isSupported) {
            statusDot.className = "status-dot status-online";
            fwBadge.style.backgroundColor = "#10e610";
            fwBadge.innerText = "SUPPORTED";
        } else {
            statusDot.className = "status-dot status-offline";
            fwBadge.style.backgroundColor = "#e51d08";
            fwBadge.style.color = "#fff";
            fwBadge.innerText = "UNSUPPORTED";
        }
    } else {
        fwText.innerHTML = "Bukan PS4";
        statusDot.className = "status-dot status-offline";
        fwBadge.style.backgroundColor = "#e74c3c";
        fwBadge.style.color = "#fff";
        fwBadge.innerText = "PC / MOBILE";
    }
});
</script>

</body>
</html>
