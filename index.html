<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slopkit Relapse by MGstore</title>
<link rel="stylesheet" href="modifikasi.css">
</head>
<body>

<div class="container">
    <hr style="width: 100%;">
    <h2>Slopkit Relapse by MGstore</h2>
    <div class="fw-status-card">
        <span class="status-dot" id="statusDot"></span>
        <span>Firmware: <b id="fwText">Detecting...</b></span>
        <span class="fw-badge" id="fwBadge">PS4</span>
    </div>

        <div class="logo-container">
        <img src="logo.png" alt="Logo MGstore" class="logo" id="mainLogo" onerror="this.style.display='none'">
    </div>

    <div class="action-container">
        <button class="btn-goldhen" id="btnGoldhen" onclick="startManualExploit()">GoldHEN</button>
        <label class="auto-jb-wrapper">
            <input type="checkbox" id="autoJB" onchange="toggleAutoJB()">
            <span>Auto Jailbreak</span>
        </label>
    </div>

    <h2 id="msgs">Sedang Memuat GoldHEN... Mohon Tunggu</h2>
    <div class="thanks-section">
      <h3>terima kasih kepada</h3>
      <div class="credit-list">
        <span class="credit-item">GamerHack93</span>
        <span class="credit-item">sleirsgoevy</span>
        <span class="credit-item">TheFlow</span>
        <span class="credit-item">Flatz</span>
        <span class="credit-item">Egycnq</span>
        <span class="credit-item">Jordy</span>
        <span class="credit-item">Sonic-Iso</span>
        <span class="credit-item">Abc</span>
        <span class="credit-item">Prb29327239</span>
        <span class="credit-item">Feyzee61</span>
        <span class="credit-item">AlAzif</span>
        <span class="credit-item">ChendoChap</span>
        <span class="credit-item">Kameleonre_</span>
        <span class="credit-item">SiSTR0</span>
      </div>
    </div>
</div>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);
var autoTimer = null;
function setMsg(htmlContent, type) {
    var msgsElem = document.getElementById("msgs");
    if(!msgsElem) return;
    
    msgsElem.className = "";
    if (type === "success") {
        msgsElem.classList.add("success");
    } else if (type === "error") {
        msgsElem.classList.add("error");
    }
    msgsElem.innerHTML = htmlContent;
}

function onScriptError() {
    setMsg("Konten Tidak Ditemukan! - Hapus Data Browser dan Muat Ulang Cache ...", "error");
}
function loadExploit() {
    var msgs = document.getElementById("msgs");
    
    if (fwNum == 5.05 || fwNum == 5.07) {
        var script = document.createElement('script');
        script.src = "505/exploit.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 7.00 && fwNum <= 8.52) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "700/alert.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 9.00 && fwNum <= 9.60) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "900/alert.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 10.00 && fwNum <= 11.02) {
        var script = document.createElement('script');
        script.src = "css/main.js";
        script.onerror = onScriptError;
        script.onload = function () {
            setTimeout(function () {
                if (typeof doJb === "function") doJb();
            }, 500);
        };
        document.head.appendChild(script);
    }
    else if (fwNum >= 11.50 && fwNum <= 12.02) {
        msgs.innerHTML ='<span class="msg-lapse">Menjalankan Lapse Kernel...</span>';
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "chain_lapse.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 12.50 && fwNum <= 13.00) {
        msgs.innerHTML ='<span class="msg-poops">Menjalankan PoopsPloit...</span>';
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "chain_poops.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 13.02 && fwNum <= 13.52) {
        msgs.innerHTML ='<span class="msg-relapse">Menjalankan Exploit Relapse...</span>';
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "jb.js?v=19";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    } else {
        setMsg('Firmware tidak didukung: <span style="color: red;">' + fwVersion + '</span>', "error");
    }
}
function clearAutoTimer() {
    if (autoTimer !== null) {
        clearInterval(autoTimer);
        autoTimer = null;
    }
}
function startManualExploit() {
    clearAutoTimer();
    loadExploit();
}
function toggleAutoJB() {
    var isChecked = document.getElementById("autoJB").checked;
    localStorage.setItem("autoJailbreak", isChecked ? "true" : "false");
    
    if (isChecked) {
        startAutoCountdown();
    } else {
        clearAutoTimer();
        document.getElementById("msgs").innerHTML = "Auto Jailbreak Dibatalkan. Klik <b>GoldHEN</b> untuk memulai.";
    }
}
function startAutoCountdown() {
    clearAutoTimer();
    
    var msgs = document.getElementById("msgs");
    var timeLeft = 5;
    
    msgs.innerHTML = "Auto Jailbreak dalam <b>" + timeLeft + "</b> detik...";
    
    autoTimer = setInterval(function() {
        timeLeft--;
        if (timeLeft > 0) {
            msgs.innerHTML = "Auto Jailbreak dalam <b>" + timeLeft + "</b> detik...";
        } else {
            clearAutoTimer();
            loadExploit();
        }
    }, 1000);
}
function updateFWStatus() {
    var fwText = document.getElementById("fwText");
    var statusDot = document.getElementById("statusDot");
    var fwBadge = document.getElementById("fwBadge");

    if (isPS4) {
        fwText.innerHTML = fwVersion;
        var isSupported = (fwNum == 5.05 || fwNum == 5.07 || (fwNum >= 7.00 && fwNum <= 13.52));
        if (isSupported) {
            statusDot.className = "status-dot status-online";
            fwBadge.style.backgroundColor = "#10e610";
            fwBadge.innerText = "SUPPORTED";
        } else {
            statusDot.className = "status-dot status-offline";
            fwBadge.style.backgroundColor = "#e51d08";
            fwBadge.style.color = "#fff";
            fwBadge.innerText = "UNSUPPORTED";
        }
    } else {
        fwText.innerHTML = "Bukan PS4";
        statusDot.className = "status-dot status-offline";
        fwBadge.style.backgroundColor = "#cc1010";
        fwBadge.style.color = "#fff";
        fwBadge.innerText = "PC / MOBILE";
    }
}
document.addEventListener("DOMContentLoaded", function() {
    var msgs = document.getElementById("msgs");
    var autoJBCheckbox = document.getElementById("autoJB");

    updateFWStatus();

    if (!isPS4) {
        setMsg("Hanya Untuk PS4 Slopkit", "error");
        return;
    }
    if (window.applicationCache && window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
            return;
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
            return;
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
            return;
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
            return;
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
            return;
        } else {
            setMsg('Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>', "error");
            return;
        }
    }
    var savedAutoJB = localStorage.getItem("autoJailbreak");
    if (savedAutoJB === "true") {
        autoJBCheckbox.checked = true;
        startAutoCountdown();
    } else {
        autoJBCheckbox.checked = false;
        msgs.innerHTML = "Silakan klik tombol <b>GoldHEN</b> untuk memulai.";
    }
});
</script>

</body>
</html>
