<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slopkit Webkit by MGstore</title>
<link rel="stylesheet" href="modifikasi.css">
</head>
<body>

<div class="container">
    <hr style="width: 100%;">
    <h2>Slopkit Webkit by MGstore</h2>
    
    <!-- Status Indikator Firmware -->
    <div class="fw-status-card">
        <span class="status-dot" id="statusDot"></span>
        <span>Firmware: <b id="fwText">Detecting...</b></span>
        <span class="fw-badge" id="fwBadge">PS4</span>
    </div>

    <hr style="width: 100%;">

    <!-- LOGO CUSTOM -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="custom-logo" id="mainLogo" onerror="this.style.display='none'">
    </div>

    <!-- Tombol Utama GoldHEN -->
    <button class="btn-goldhen" id="btnGoldhen" onclick="startManualExploit()">GoldHEN</button>

    <!-- Menu Checkbox Auto Jailbreak -->
    <label class="auto-jb-wrapper">
        <input type="checkbox" id="autoJB" onchange="toggleAutoJB()">
        <span>Auto Jailbreak</span>
    </label>

    <!-- Pesan Status & Output -->
    <h2 id="msgs">Memuat GoldHEN... Mohon Tunggu</h2>

    <!-- Credits -->
    <div class="credits">
        <strong>Special Thanks to:</strong><br>
        <a href="#">GamerHack93</a> <a href="#">sleirsgoevy</a> <a href="#">TheFlow</a> <a href="#">Flatz</a> 
        <a href="#">Egycnq</a> <a href="#">Jordy</a> <a href="#">Sonic-Iso</a> <a href="#">Feyzee61</a> 
        <a href="#">AlAzif</a> <a href="#">ChendoChap</a> <a href="#">Kameleonre_</a> <a href="#">SiSTR0</a>
    </div>
    <hr style="width: 100%;">
</div>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);
var autoTimer = null;

function onScriptError() {
    document.getElementById("msgs").innerHTML = "Konten Tidak Ditemukan! - Hapus Data Browser dan Muat Ulang Cache ...";
}

// Fungsi Eksekusi Payload
function loadExploit() {
    var msgs = document.getElementById("msgs");
    if (fwNum >= 11.50 && fwNum <= 12.02) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "chain_lapse.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    } else if (fwNum >= 12.50 && fwNum <= 13.00) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "chain_poops.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    } else if (fwNum >= 13.02 && fwNum <= 13.52) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "jb.js?v=19";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    } else {
        setMsg('Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>');
 }

}

// Penghentian Timer Hitung Mundur
function clearAutoTimer() {
    if (autoTimer !== null) {
        clearInterval(autoTimer);
        autoTimer = null;
    }
}

// Handler Klik Manual (Tombol GoldHEN)
function startManualExploit() {
    clearAutoTimer();
    loadExploit();
}

// Toggle Checkbox Auto JB
function toggleAutoJB() {
    var isChecked = document.getElementById("autoJB").checked;
    localStorage.setItem("autoJailbreak", isChecked ? "true" : "false");
    
    if (isChecked) {
        startAutoCountdown();
    } else {
        clearAutoTimer();
        document.getElementById("msgs").innerHTML = "Auto Jailbreak Dibatalkan. Klik <b>GoldHEN</b> untuk memulai.";
    }
}

// Fungsi Hitung Mundur Auto Jailbreak
function startAutoCountdown() {
    clearAutoTimer();
    
    var msgs = document.getElementById("msgs");
    var timeLeft = 5;
    
    // Tampilkan pesan awal detik ke-5 secara langsung
    msgs.innerHTML = "Auto Jailbreak dalam <b>" + timeLeft + "</b> detik...";
    
    autoTimer = setInterval(function() {
        timeLeft--;
        if (timeLeft > 0) {
            msgs.innerHTML = "Auto Jailbreak dalam <b>" + timeLeft + "</b> detik...";
        } else {
            clearAutoTimer();
            loadExploit();
        }
    }, 1000);
}

// Inisialisasi Indikator Firmware
function updateFWStatus() {
    var fwText = document.getElementById("fwText");
    var statusDot = document.getElementById("statusDot");
    var fwBadge = document.getElementById("fwBadge");


    if (isPS4) {
        fwText.innerHTML = fwVersion;
        var isSupported = (fwNum == 5.05 || fwNum == 5.07 || 
                           (fwNum >= 7.00 && fwNum <= 8.52) || 
                           (fwNum >= 9.00 && fwNum <= 9.60) || 
                           (fwNum >= 10.00 && fwNum <= 11.02) || 
                           (fwNum >= 11.50 && fwNum <= 13.52));
        if (isSupported) {
            statusDot.className = "status-dot status-online";
            fwBadge.style.backgroundColor = "#10e610";
            fwBadge.innerText = "SUPPORTED";
        } else {
            statusDot.className = "status-dot status-offline";
            fwBadge.style.backgroundColor = "#e51d08";
            fwBadge.style.color = "#fff";
            fwBadge.innerText = "UNSUPPORTED";
        }
    } else {
        fwText.innerHTML = "Bukan PS4";
        statusDot.className = "status-dot status-offline";
        fwBadge.style.backgroundColor = "#e74c3c";
        fwBadge.style.color = "#fff";
        fwBadge.innerText = "PC / MOBILE";
    }
}

// Inisialisasi Utama Saat Halaman Dimuat
document.addEventListener("DOMContentLoaded", function() {
    var msgs = document.getElementById("msgs");
    var autoJBCheckbox = document.getElementById("autoJB");

    updateFWStatus();

    // Cek Perangkat PS4
    if (!isPS4) {
        msgs.innerHTML = "Hanya Untuk PS4 Slopkit";
        return;
    }

    // Penanganan Cache Browser
    if (window.applicationCache && window.applicationCache.status == '0') {
        if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
            return;
        } else {
            msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            return;
        }
    }

    // Load Preferensi Checkbox dari localStorage
    var savedAutoJB = localStorage.getItem("autoJailbreak");
    if (savedAutoJB === "true") {
        autoJBCheckbox.checked = true;
        startAutoCountdown();
    } else {
        autoJBCheckbox.checked = false;
        msgs.innerHTML = "Silakan klik tombol <b>GoldHEN</b> untuk memulai.";
    }
});
</script>

</body>
</html>
